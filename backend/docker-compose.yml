

services:
  postgres:
    image: postgres:15
    container_name: gf_hrms_db
    environment:
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_pass_2025
      POSTGRES_DB: gf_hrms
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gf_hrms_redis
    ports:
      - "127.0.0.1:16379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: gf_hrms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass_2025
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: